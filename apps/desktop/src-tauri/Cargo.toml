[package]
name = "nocturne-desktop"
description = "The Nocturne desktop application: the backend in process, the interface in a system WebView."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The library holds everything testable; `main.rs` only calls `run`.
name = "nocturne_desktop"
crate-type = ["lib"]

[[bin]]
name = "nocturne"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The ISP edition, passed straight through to the suite. Building without it
# is the free edition, and the billing code is not in the binary at all; see
# `docs/dev/spec-editions.md`.
isp = ["nocturne-suite/isp"]

[dependencies]
nocturne-suite.workspace = true
# `tray-icon` is the icon "Keep running in the tray" leaves (src/tray.rs). On
# Linux it is drawn by libayatana-appindicator3, loaded when the icon is
# made, and the packages depend on it: release.yml builds them against the
# Ayatana library, which Debian 12 and 13 and Ubuntu ship.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
# Reading text for the Terminal screen's Paste button and context menu: a
# script in the WebView may not read the clipboard itself. Only `read_text`
# is granted (capabilities/default.json); see docs/dev/spec-desktop.md.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
tauri-plugin-dialog = "2"
parking_lot.workspace = true
dirs.workspace = true
anyhow.workspace = true

# `--help`, `--version` and a refused argument, said in a message box when a
# Windows release build was started without anywhere to print them. The same
# version and features `tauri-plugin-dialog` already builds, so nothing new
# is compiled.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# Only to start a job the way a feature does, so that quitting can be shown
# to wait for it: the shell itself reaches the engine through the suite.
nocturne-app.workspace = true

[lints]
workspace = true
