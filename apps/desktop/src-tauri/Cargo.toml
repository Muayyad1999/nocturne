[package]
name = "nocturne-desktop"
description = "The Nocturne desktop application: the backend in process, the interface in a system WebView."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The library holds everything testable; `main.rs` only calls `run`.
name = "nocturne_desktop"
crate-type = ["lib"]

[[bin]]
name = "nocturne"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The ISP edition, passed straight through to the suite. Building without it
# is the free edition, and the billing code is not in the binary at all; see
# `docs/dev/spec-editions.md`.
isp = ["nocturne-suite/isp"]

[dependencies]
nocturne-suite.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
tauri-plugin-dialog = "2"
parking_lot.workspace = true
dirs.workspace = true
anyhow.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
