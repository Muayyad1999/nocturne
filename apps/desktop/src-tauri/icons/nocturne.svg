<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nocturne: a crescent drawn as a constellation of nodes and links,
       because the topology of a network reads as a star map. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#17203a"/>
      <stop offset="100%" stop-color="#090d18"/>
    </radialGradient>
    <linearGradient id="moonlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9db4ff"/>
      <stop offset="100%" stop-color="#7c9cff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#sky)"/>
  <g stroke="url(#moonlight)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.95">
    <!-- the crescent, as links between nodes -->
    <path d="M330 104 L236 132"/>
    <path d="M236 132 L168 198"/>
    <path d="M168 198 L152 286"/>
    <path d="M152 286 L202 364"/>
    <path d="M202 364 L292 400"/>
    <path d="M292 400 L368 374"/>
    <!-- the inner edge, which makes it a crescent rather than a ring -->
    <path d="M330 104 L300 186" opacity="0.75"/>
    <path d="M300 186 L268 266" opacity="0.75"/>
    <path d="M268 266 L286 334" opacity="0.75"/>
    <path d="M286 334 L368 374" opacity="0.75"/>
  </g>
  <g fill="#e7ebf3">
    <circle cx="330" cy="104" r="19"/>
    <circle cx="236" cy="132" r="13"/>
    <circle cx="168" cy="198" r="13"/>
    <circle cx="152" cy="286" r="15"/>
    <circle cx="202" cy="364" r="13"/>
    <circle cx="292" cy="400" r="13"/>
    <circle cx="368" cy="374" r="17"/>
    <circle cx="300" cy="186" r="11" fill="#9db4ff"/>
    <circle cx="268" cy="266" r="11" fill="#9db4ff"/>
    <circle cx="286" cy="334" r="11" fill="#9db4ff"/>
  </g>
  <!-- distant stars -->
  <g fill="#a8b3c7" opacity="0.85">
    <circle cx="398" cy="178" r="5"/>
    <circle cx="420" cy="262" r="4"/>
    <circle cx="112" cy="146" r="4"/>
    <circle cx="96" cy="372" r="5"/>
    <circle cx="374" cy="456" r="4"/>
  </g>
</svg>
