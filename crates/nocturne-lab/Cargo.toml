[package]
name = "nocturne-lab"
description = "Virtual labs on the network simulator: runtime, consoles, inventory sync, packet tracing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nocturne-app.workspace = true
# The simulator this crate gives a life to.
nocturne-netsim.workspace = true
# `Connection` for consoles, and the SSH and Telnet servers `labs.expose` uses.
nocturne-transport.workspace = true
# Collected models and interface-name normalisation, for `labs.twin`.
nocturne-drivers.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# Lab files are shareable as YAML as well as JSON.
serde_yaml_ng.workspace = true
tracing.workspace = true
parking_lot.workspace = true

[dev-dependencies]
nocturne-app = { workspace = true, features = ["testing"] }
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
