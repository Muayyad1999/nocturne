[package]
name = "nocturne-suite"
description = "The whole Nocturne backend assembled: the application core plus every feature module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The ISP edition. Off by default, which is the whole mechanism: the free
# build does not *contain* the billing code — not disabled at run time, not
# dead behind a flag, absent from the binary. There is deliberately no
# edition setting to flip, because a client-side switch that unlocks paid
# features is security theatre. See `docs/dev/spec-editions.md`.
isp = ["dep:nocturne-isp"]

[dependencies]
# Feature crates are added here as they land; each exposes `init(&mut AppBuilder)`.
nocturne-app.workspace = true
nocturne-assistant.workspace = true
nocturne-automation.workspace = true
nocturne-changes.workspace = true
nocturne-config.workspace = true
nocturne-discovery.workspace = true
nocturne-insights.workspace = true
nocturne-ipam.workspace = true
nocturne-isp = { workspace = true, optional = true }
nocturne-lab.workspace = true
nocturne-logs.workspace = true
nocturne-monitor.workspace = true
nocturne-ops.workspace = true
nocturne-terminal.workspace = true
nocturne-toolbox.workspace = true
nocturne-topology.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true
# `tests/single_prompt.rs` needs a simulated device and a scripted model: this
# is the only crate where the assistant and the change engine are both real.
nocturne-app = { workspace = true, features = ["testing"] }
nocturne-ai.workspace = true

[lints]
workspace = true
