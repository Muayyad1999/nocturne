[package]
name = "nocturne-terminal"
description = "Interactive terminal sessions, SFTP, snippets and session logs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nocturne-app.workspace = true
nocturne-drivers.workspace = true
nocturne-transport.workspace = true
# Only for `Redactor`: text handed out for "explain this" hides device secrets by default.
nocturne-ai.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
bytes.workspace = true
base64.workspace = true
# Only to print the fingerprint of a generated key the way `ssh-keygen -l` does.
sha2.workspace = true
regex.workspace = true
chrono.workspace = true
zeroize.workspace = true
# The index of session logs is this feature's own table (see `logs.rs`).
rusqlite.workspace = true

[dev-dependencies]
nocturne-app = { workspace = true, features = ["testing"] }
async-trait.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
