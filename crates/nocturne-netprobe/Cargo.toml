[package]
name = "nocturne-netprobe"
description = "Active network probes and small servers: ping, traceroute, scans, DNS, TLS, NTP, TFTP, syslog, NetFlow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
socket2.workspace = true
hickory-resolver.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-platform-verifier.workspace = true
x509-parser.workspace = true
if-addrs.workspace = true
regex.workspace = true
bytes.workspace = true
# Certificate fingerprints (SHA-256) and random ICMP identifiers / nonces.
sha2.workspace = true
getrandom.workspace = true

# Safe wrappers for the two Linux-only socket features the probes need: the IP_RECVERR error
# queue (unprivileged traceroute, ICMP errors on ping sockets) and the TTL of received packets.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["socket", "net", "uio"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
# Generates the self-signed and expired certificates of the TLS / HTTPS loopback tests.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }

[lints]
workspace = true
