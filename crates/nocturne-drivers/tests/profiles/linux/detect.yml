banner:
  match:
    # The distribution's own OpenSSH build names it.
    - "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6"
    - "SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3"
    # What a login prints before the first prompt.
    - "Welcome to Ubuntu 24.04.5 LTS (GNU/Linux 6.8.0-45-generic x86_64)\r\n\r\n  System load: 0.08\r\n"
    - "Linux core-fw 6.1.0-18-amd64 #1 SMP PREEMPT_DYNAMIC Debian 6.1.76-1 (2024-02-01) x86_64 GNU/Linux\r\n"
  reject:
    # OpenSSH without a distribution behind it is no evidence: network
    # appliances run it too.
    - "SSH-2.0-OpenSSH_9.6"
    - "SSH-2.0-OpenSSH_7.5 FreeBSD-20170903"
    - "SSH-2.0-Cisco-1.25"
    - "SSH-2.0-ROSSSH"
    - "SSH-2.0-dropbear_2022.83"
snmp:
  match:
    - sysdescr: "Linux core-fw 5.15.0-91-generic #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023 x86_64"
      sysobjectid: 1.3.6.1.4.1.8072.3.2.10
    - sysdescr: "Linux sensor-01 6.1.0-18-amd64 #1 SMP PREEMPT_DYNAMIC Debian 6.1.76-1 x86_64"
      sysobjectid: .1.3.6.1.4.1.8072.3.2.10
  reject:
    - sysdescr: "Cisco IOS Software, C3750E Software (C3750E-UNIVERSALK9-M), Version 15.2(4)E10"
      sysobjectid: 1.3.6.1.4.1.9.1.516
    - sysdescr: "MikroTik RouterOS 6.49.7 (long-term) RB750Gr3"
      sysobjectid: 1.3.6.1.4.1.14988.1
    # RouterOS also runs a Linux kernel, but says so with its own name.
    - sysdescr: "RouterOS CCR2004-1G-12S+2XS"
      sysobjectid: 1.3.6.1.4.1.14988.1
probe:
  match:
    - "uname -sr": "Linux 6.8.0-45-generic\n"
    - "uname -sr": "Linux 5.15.0-91-generic\n"
  reject:
    # An IOS switch rejects the probe; the rejection is not a Linux answer.
    - "uname -sr": "              ^\n% Invalid input detected at '^' marker.\n"
    # Another Unix is not Linux.
    - "uname -sr": "FreeBSD 14.0-RELEASE\n"
    - "uname -sr": "SunOS 5.11\n"
