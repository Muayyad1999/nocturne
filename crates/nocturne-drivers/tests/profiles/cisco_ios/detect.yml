banner:
  match:
    - "SSH-2.0-Cisco-1.25"
    - "SSH-1.99-Cisco-1.25"
    - "\r\nUser Access Verification\r\n\r\nUsername: "
  reject:
    - "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6"
    - "SSH-2.0-ROSSSH"
    - "SSH-2.0-Cisco-2.0"                 # IOS XR
    - "SSH-2.0-HUAWEI-1.5"
snmp:
  match:
    - sysdescr: "Cisco IOS Software, C3750E Software (C3750E-UNIVERSALK9-M), Version 15.2(4)E10, RELEASE SOFTWARE (fc2)\r\nTechnical Support: http://www.cisco.com/techsupport\r\nCopyright (c) 1986-2020 by Cisco Systems, Inc.\r\nCompiled Tue 31-Mar-20 21:44 by prod_rel_team"
      sysobjectid: 1.3.6.1.4.1.9.1.516
    - sysdescr: "Cisco IOS Software [Gibraltar], Catalyst L3 Switch Software (CAT9K_IOSXE), Version 16.12.4, RELEASE SOFTWARE (fc5)"
      sysobjectid: .1.3.6.1.4.1.9.1.2494
    - sysdescr: "Cisco Internetwork Operating System Software \r\nIOS (tm) C2950 Software (C2950-I6K2L2Q4-M), Version 12.1(22)EA14, RELEASE SOFTWARE (fc1)"
      sysobjectid: 1.3.6.1.4.1.9.1.359
    # The object id alone is enough when sysDescr was not read.
    - sysdescr: ""
      sysobjectid: 1.3.6.1.4.1.9.1.1208
  reject:
    - sysdescr: "RouterOS CCR2004-1G-12S+2XS"
      sysobjectid: 1.3.6.1.4.1.14988.1
    - sysdescr: "Linux core-fw 5.15.0-91-generic #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023 x86_64"
      sysobjectid: 1.3.6.1.4.1.8072.3.2.10
    - sysdescr: "Juniper Networks, Inc. ex2200-24t-4g Ethernet Switch, kernel JUNOS 12.3R9.4"
      sysobjectid: 1.3.6.1.4.1.2636.1.1.1.2.31
probe:
  match:
    - "show version": |
        Cisco IOS Software, C2960 Software (C2960-LANBASEK9-M), Version 12.2(55)SE9, RELEASE SOFTWARE (fc1)
        Technical Support: http://www.cisco.com/techsupport
        Copyright (c) 1986-2014 by Cisco Systems, Inc.

        SW1 uptime is 5 weeks, 2 days, 3 hours, 4 minutes
    - "show version": |
        Cisco IOS XE Software, Version 16.12.04
        Cisco IOS Software [Gibraltar], Catalyst L3 Switch Software (CAT9K_IOSXE), Version 16.12.4, RELEASE SOFTWARE (fc5)
    - "show version": |
        Cisco Internetwork Operating System Software
        IOS (tm) C2950 Software (C2950-I6K2L2Q4-M), Version 12.1(22)EA14, RELEASE SOFTWARE (fc1)
    # A device of Nocturne's own lab: the IOS-style CLI without the Cisco name.
    - "show version": |
        Nocturne Virtual Software (NVOS-L3-UNIVERSALK9), Version 15.9(3)M, RELEASE SOFTWARE (fc1)
        Lab device simulated by Nocturne - not a vendor image
        ROM: Bootstrap program is NVOS boot loader
  reject:
    # Other Cisco operating systems answer `show version` too.
    - "show version": |
        Cisco Nexus Operating System (NX-OS) Software
        TAC support: http://www.cisco.com/tac
    - "show version": |
        Cisco IOS XR Software, Version 7.3.2
        Copyright (c) 2013-2021 by Cisco Systems, Inc.
    - "show version": |
        Cisco Adaptive Security Appliance Software Version 9.12(4)
    - "show version": "bad command name show (line 1 column 1)\n"
    - "show version": "-bash: show: command not found\n"
