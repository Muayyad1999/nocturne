# ProVision is identified by its sysDescr, by the hpSwitch object id and by
# what `show version` says.
#
# There is no `banner` section: ProVision's SSH identification string varies by
# release and is recorded nowhere in this repository, so the profile does not
# guess at one. The pre-login screen would identify it too, but that is only
# documented, not captured.
snmp:
  match:
    - sysdescr: "ProCurve J9086A Switch 2610-24-PPoE, revision R.11.25, ROM R.10.06 (/sw/code/build/sanf(ts_08_5))"
      sysobjectid: 1.3.6.1.4.1.11.2.3.7.11.68
    - sysdescr: "HP J9773A 2530-24G-PoEP Switch, revision YA.16.02.0012, ROM YA.15.20 (/ws/swbuildm/rel_orlando_qaoff/code/build/bom)"
      sysobjectid: 1.3.6.1.4.1.11.2.3.7.11.141
    # Aruba-branded, still ProVision: the "revision WC.16.…" numbering is the
    # giveaway, and ArubaOS-CX does not use it.
    - sysdescr: "Aruba JL256A 2930F-48G-PoE+-4SFP+ Switch, revision WC.16.10.0012, ROM WC.16.01.0003 (/ws/swbuildm/rel_yakima_qaoff/code/build/bom)"
      sysobjectid: ""
    # The object id on its own.
    - sysdescr: ""
      sysobjectid: 1.3.6.1.4.1.11.2.3.7.11.180
  reject:
    - sysdescr: "Cisco IOS Software, C2960 Software (C2960-LANBASEK9-M), Version 12.2(55)SE9, RELEASE SOFTWARE (fc1)"
      sysobjectid: 1.3.6.1.4.1.9.1.696
    - sysdescr: "RouterOS CCR2004-1G-12S+2XS"
      sysobjectid: 1.3.6.1.4.1.14988.1
    - sysdescr: "Linux fileserver 6.1.0-18-amd64 #1 SMP Debian 6.1.76-1 x86_64"
      sysobjectid: 1.3.6.1.4.1.8072.3.2.10
    # HP hardware, but not a ProVision switch: an iLO management processor. The
    # HP enterprise number alone is not evidence, which is why the object id
    # claimed is hpSwitch (…11.2.3.7.11.) and not …1.3.6.1.4.1.11.
    - sysdescr: "HP Integrated Lights-Out 4 standard firmware 2.78"
      sysobjectid: 1.3.6.1.4.1.232.9.4.11
probe:
  match:
    # ProVision's `show version`. Written from the platform's documented
    # output: the one `show version` capture for this platform in the
    # ntc-templates corpus is an Aruba access point's, not a switch's (see
    # NOTES.md).
    - "show version": |
        Image stamp:    /ws/swbuildm/rel_orlando_qaoff/code/build/bom(swbuildm_rel_orlando_qaoff_rel_orlando)
                        Jun 10 2016 09:43:25
                        YA.16.02.0012
                        1662
        Boot Image:     Primary

        Boot ROM Version:    YA.15.20
        Active Boot ROM:     Primary
    - "show version": |
        Image stamp:    /ws/swbuildm/rel_yakima_qaoff/code/build/bom(*)
                        Jan 24 2020 07:46:11
                        WC.16.10.0012
                        1
        Boot Image:     Secondary
  reject:
    - "show version": |
        Cisco IOS Software, C2960 Software (C2960-LANBASEK9-M), Version 12.2(55)SE9, RELEASE SOFTWARE (fc1)
        Copyright (c) 1986-2014 by Cisco Systems, Inc.
    - "show version": |
        Hostname: edge-rtr
        Model: mx204
        Junos: 20.4R3-S4.8
    - "show version": |
        Cisco IOS XR Software, Version 7.3.2 LNT
        Copyright (c) 2013-2021 by Cisco Systems, Inc.
    - "show version": "bad command name show (line 1 column 1)\n"
    - "show version": "-bash: show: command not found\n"
