kinds:
  routes:
    # Four of the seven rows are the equal-cost paths of one EIGRP prefix.
    count: 7
    rows:
      # "S*   0.0.0.0/0 [1/0] via 10.72.0.1, 4d01h": the `*` of a candidate
      # default is stripped before the code is looked up.
      - prefix: 0.0.0.0/0
        protocol: static
        next_hop: 10.72.0.1
        interface: ""
        distance: 1
        metric: 0
        vrf: ""
      - prefix: 10.39.0.0/16
        protocol: bgp
        next_hop: 192.168.50.1
        distance: 20
        metric: 0
      - prefix: 10.15.0.0/16
        protocol: bgp
        next_hop: 192.168.250.130
        distance: 20
      # One prefix, four paths. "D EX" is a two-letter code with a space in it.
      - next_hop: 192.168.150.130
        prefix: 10.14.0.0/16
        protocol: eigrp external
        interface: TenGigE0/0/0/1.5
        distance: 170
        metric: 153600
      - next_hop: 192.168.150.134
        prefix: 10.14.0.0/16
        protocol: eigrp external
        interface: TenGigE0/0/0/2.5
      - next_hop: 192.168.150.138
        prefix: 10.14.0.0/16
        protocol: eigrp external
        interface: TenGigE0/0/0/3.5
      - next_hop: 192.168.150.142
        prefix: 10.14.0.0/16
        protocol: eigrp external
        interface: TenGigE0/0/0/4.5
