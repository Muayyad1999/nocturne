kinds:
  neighbors:
    count: 5
    rows:
      # The neighbour advertises its own short spelling of the port
      # (`Fou1/0/22`); the port description is a sentence about the link and is
      # not used while there is a port id.
      - device: router-400.router.com
        local_interface: FourHundredGigE0/0/0/0
        remote_interface: Fou1/0/22
        address: 172.1.1.79
        capabilities: B,R
        protocol: lldp
        platform: "Cisco IOS Software [Cupertino], Catalyst L3 Switch Software (CAT9K_IOSXE), Version 17.9.3, RELEASE SOFTWARE (fc6)"
      # Another XR router: the port id is the full name.
      - device: router2.com
        local_interface: FourHundredGigE0/0/0/28
        remote_interface: FourHundredGigE0/0/0/28
        address: 172.1.1.64
        capabilities: R
        protocol: lldp
        platform: 7.9.2, 8000
      - device: router66.router.com
        local_interface: FourHundredGigE0/0/0/29
        remote_interface: FourHundredGigE0/0/0/29
        address: 172.1.1.66
        capabilities: R
        protocol: lldp
      # Two Nexus 7700s that share a management address.
      - device: otter-buffy
        local_interface: HundredGigE0/0/0/30
        remote_interface: Eth1/4
        address: 172.1.1.158
        capabilities: B,R
        protocol: lldp
      - device: onyx.mgmt.com
        local_interface: HundredGigE0/0/0/31
        remote_interface: Eth2/4
        address: 172.1.1.158
        capabilities: B,R
        protocol: lldp
