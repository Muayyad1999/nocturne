# IOS XR is identified by its sysDescr and by what `show version` says.
#
# There is no `banner` section: XR's SSH identification string
# (`SSH-2.0-Cisco-2.0`) is shared with other Cisco operating systems, so this
# profile does not claim it. There is no `sysobjectid` section either — XR
# routers answer with an object id under ciscoProducts (1.3.6.1.4.1.9.1.),
# which says which box it is, not which operating system. The first SNMP case
# below is exactly that situation: the object id is one `cisco_ios` claims, and
# the sysDescr has to win.
snmp:
  match:
    - sysdescr: "Cisco IOS XR Software (Cisco ASR9K Series),  Version 6.1.4[Default]\r\nCopyright (c) 2016 by Cisco Systems, Inc."
      sysobjectid: 1.3.6.1.4.1.9.1.1639
    - sysdescr: "Cisco IOS XR Software, Version 7.3.2, NCS-5500"
      sysobjectid: ""
    - sysdescr: "Cisco IOS-XR Software (Cisco CRS-8/S), Version 4.1.0"
      sysobjectid: .1.3.6.1.4.1.9.1.1098
  reject:
    - sysdescr: "Cisco IOS Software, C3750E Software (C3750E-UNIVERSALK9-M), Version 15.2(4)E10, RELEASE SOFTWARE (fc2)"
      sysobjectid: 1.3.6.1.4.1.9.1.516
    - sysdescr: "Cisco IOS Software [Gibraltar], Catalyst L3 Switch Software (CAT9K_IOSXE), Version 16.12.4, RELEASE SOFTWARE (fc5)"
      sysobjectid: 1.3.6.1.4.1.9.1.2494
    - sysdescr: "RouterOS CCR2004-1G-12S+2XS"
      sysobjectid: 1.3.6.1.4.1.14988.1
    # A Cisco object id with nothing in sysDescr: that is not evidence of XR.
    - sysdescr: ""
      sysobjectid: 1.3.6.1.4.1.9.1.1208
probe:
  match:
    - "show version": |
        Cisco IOS XR Software, Version 4.1.0[Default]
        Copyright (c) 2010 by Cisco Systems, Inc.

        ROM: System Bootstrap, Version 2.100(20100129:213223) [CRS-1 ROMMON],

        router uptime is 1 week, 6 days, 4 hours, 22 minutes
    - "show version": |
        Cisco IOS XR Software, Version 7.3.2 LNT
        Copyright (c) 2013-2021 by Cisco Systems, Inc.

        Build Information:
         Built By     : ingunawa
         Built On     : Mon Oct 11 20:36:02 UTC 2021
         Built Host   : iox-ucs-029
    # Older releases spell it with a hyphen.
    - "show version": |
        Cisco IOS-XR Software (Cisco CRS-8/S), Version 4.1.0
        Copyright (c) 2010 by Cisco Systems, Inc.
  reject:
    # The other Cisco operating systems answer `show version` too.
    - "show version": |
        Cisco IOS Software, C2960 Software (C2960-LANBASEK9-M), Version 12.2(55)SE9, RELEASE SOFTWARE (fc1)
        Copyright (c) 1986-2014 by Cisco Systems, Inc.
    - "show version": |
        Cisco IOS XE Software, Version 16.12.04
        Cisco IOS Software [Gibraltar], Catalyst L3 Switch Software (CAT9K_IOSXE), Version 16.12.4, RELEASE SOFTWARE (fc5)
    - "show version": |
        Cisco Adaptive Security Appliance Software Version 9.12(4)
    - "show version": "bad command name show (line 1 column 1)\n"
    - "show version": "-bash: show: command not found\n"
