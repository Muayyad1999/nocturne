# Evidence that must select `arista_eos`, and evidence that must not, judged
# against the whole built-in pack.
#
# There is no `banner` section because the profile claims no banner: EOS
# answers SSH as OpenSSH does, which is also what a Linux host says.
snmp:
  match:
    # sysDescr and an object id under the Arista enterprise tree (30065).
    - sysdescr: "Arista Networks EOS version 4.31.6M running on an Arista Networks cEOSLab"
      sysobjectid: 1.3.6.1.4.1.30065.1.3011.7050
    # sysDescr on its own, when the object id was not read.
    - sysdescr: "Arista Networks EOS version 4.26.1F running on an Arista Networks DCS-7050QX-32S"
      sysobjectid: ""
    # The object id on its own.
    - sysdescr: ""
      sysobjectid: .1.3.6.1.4.1.30065.1.3011.7280
  reject:
    - sysdescr: "Cisco IOS Software, C3750E Software (C3750E-UNIVERSALK9-M), Version 15.2(4)E10, RELEASE SOFTWARE (fc2)"
      sysobjectid: 1.3.6.1.4.1.9.1.516
    - sysdescr: "Cisco NX-OS(tm) n9000, Software (n9000-dk9), Version 9.3(10), RELEASE SOFTWARE Copyright (c) 2002-2023 by Cisco Systems, Inc."
      sysobjectid: 1.3.6.1.4.1.9.12.3.1.3.1084
    - sysdescr: "Linux core-fw 5.15.0-91-generic #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023 x86_64"
      sysobjectid: 1.3.6.1.4.1.8072.3.2.10
    - sysdescr: "RouterOS CCR2004-1G-12S+2XS"
      sysobjectid: 1.3.6.1.4.1.14988.1
probe:
  match:
    # The opening lines of the recorded `show version` of a cEOS lab switch,
    # verbatim (captures/ceos-lab/show_version.txt).
    - "show version": |
        Arista cEOSLab
        Hardware version:
        Serial number: 35BA12C16E793CAD48DE0EEC072CFD74
        Hardware MAC address: 001c.73cd.2352
        System MAC address: 001c.73cd.2352
    # The same opening on hardware: model instead of the lab image, then a
    # hardware version. (Layout from Arista's documentation, not a capture.)
    - "show version": |
        Arista DCS-7050QX-32S-F
        Hardware version: 01.31
        Serial number: JPE15200001
        System MAC address: 444c.a8f0.0001

        Software image version: 4.26.1F
  reject:
    # Other vendors' answers to the same command.
    - "show version": |
        Cisco IOS Software, C2960 Software (C2960-LANBASEK9-M), Version 12.2(55)SE9, RELEASE SOFTWARE (fc1)
        Copyright (c) 1986-2014 by Cisco Systems, Inc.
    - "show version": |
        Cisco Nexus Operating System (NX-OS) Software
        TAC support: http://www.cisco.com/tac
    - "show version": "-bash: show: command not found\n"
    - "show version": "bad command name show (line 1 column 1)\n"
