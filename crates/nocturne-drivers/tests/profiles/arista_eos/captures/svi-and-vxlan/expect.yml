kinds:
  interfaces:
    # Only the two interfaces of `show interfaces`: the rows of
    # `show interfaces status` belong to another device and are dropped.
    count: 2
    rows:
      # "Vlan888 is up, line protocol is up (connected)"
      - name: Vlan888
        admin_up: true
        oper_up: true
        kind: Vlan
        mac: fc:59:c0:e3:a5:79
        # "IP MTU 1500 bytes (default)"
        mtu: 1500
        # "No Internet protocol address assigned"
        ipv4: []
        description: ""
        # nothing merged in from the other device's `show interfaces status`
        mode: ""
        vlan: null
        duplex: ""
        speed_bps: null
      # "Hardware is Vxlan" and nothing else: no address, no MTU.
      - name: Vxlan1
        admin_up: true
        oper_up: true
        kind: Vxlan
        mac: ""
        mtu: null
        ipv4: []

# `show interfaces status` here comes from a different device than
# `show interfaces`, so not one of its rows matches a row to enrich. The
# collector says so rather than passing for complete, which is the whole
# point: every field that step exists to fill — `mode`, `vlan`, `duplex`,
# `speed_bps` — is missing from the rows below, and this is the only thing
# that says why. It is also an honest statement of how far this step is
# verified: not at all. See NOTES.md.
problems:
  - kind: interfaces
    code: partial
    contains: "none of them matched an existing row on `name`"
