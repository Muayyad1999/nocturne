# Junos is identified by its sysDescr, by the Juniper enterprise object id and
# by what `show version` says.
#
# There is no `banner` section: Junos answers SSH with an OpenSSH
# identification string, which says nothing about the platform and would
# collide with every Linux host.
snmp:
  match:
    - sysdescr: "Juniper Networks, Inc. ex4200-48t Ethernet Switch, kernel JUNOS 12.3R12.4, Build date: 2016-01-27 04:11:57 UTC Copyright (c) 1996-2016 Juniper Networks, Inc."
      sysobjectid: 1.3.6.1.4.1.2636.1.1.1.2.31
    - sysdescr: "Juniper Networks, Inc. mx240 internet router, kernel JUNOS 20.4R3-S4.8, Build date: 2022-04-14"
      sysobjectid: 1.3.6.1.4.1.2636.1.1.1.2.25
    # The object id alone, which is still Juniper.
    - sysdescr: ""
      sysobjectid: 1.3.6.1.4.1.2636.1.1.1.4.82.3
    # JUNOS in the description, no object id.
    - sysdescr: "Juniper Networks, Inc. qfx5120-48y, kernel JUNOS 21.4R3.15"
      sysobjectid: ""
  reject:
    - sysdescr: "Cisco IOS Software, C2960 Software (C2960-LANBASEK9-M), Version 12.2(55)SE9, RELEASE SOFTWARE (fc1)"
      sysobjectid: 1.3.6.1.4.1.9.1.696
    - sysdescr: "RouterOS CCR2004-1G-12S+2XS"
      sysobjectid: 1.3.6.1.4.1.14988.1
    - sysdescr: "Linux fileserver 6.1.0-18-amd64 #1 SMP PREEMPT_DYNAMIC Debian 6.1.76-1 x86_64"
      sysobjectid: 1.3.6.1.4.1.8072.3.2.10
probe:
  match:
    # Copied from the first lines of captures/mx240-version/show_version.txt.
    - "show version": |
        fpc0:
        -------------------------------------------------------------------------
        Hostname: lab
        Model: mx240
        Junos: 13.3R1.4
        JUNOS Base OS boot [13.3R1.4]
    # A current release, which no longer prints a "JUNOS Base OS" line.
    - "show version": |
        Hostname: edge-rtr
        Model: mx204
        Junos: 20.4R3-S4.8
        JUNOS OS Kernel 64-bit  [20210726.ca7dc38_builder_stable_11-204ab]
        JUNOS OS libs [20210726.ca7dc38_builder_stable_11-204ab]
  reject:
    # The other platforms that answer `show version`.
    - "show version": |
        Cisco IOS Software, C2960 Software (C2960-LANBASEK9-M), Version 12.2(55)SE9, RELEASE SOFTWARE (fc1)
        Copyright (c) 1986-2014 by Cisco Systems, Inc.
    - "show version": |
        Cisco IOS XR Software, Version 7.3.2 LNT
        Copyright (c) 2013-2021 by Cisco Systems, Inc.
    # ScreenOS, which answers under the same Juniper enterprise object id but
    # is not Junos and is not claimed by this profile.
    - "show version": |
        Product Name: SSG-140
        Serial Number: 0162102012000081, Control Number: 00000000
        Software Version: 6.3.0r14.0, Type: Firewall+VPN
    - "show version": "bad command name show (line 1 column 1)\n"
    - "show version": "-bash: show: command not found\n"
