# Evidence that must select `cisco_nxos`, and evidence that must not, judged
# against the whole built-in pack.
#
# There is no `banner` section because the profile claims no banner: NX-OS
# answers SSH as OpenSSH does and shows IOS's "User Access Verification"
# login screen, which `cisco_ios` already claims.
snmp:
  match:
    - sysdescr: "Cisco Nexus Operating System (NX-OS) Software 9.3(10)\r\nTAC support: http://www.cisco.com/tac\r\nCopyright (c) 2002-2023, Cisco Systems, Inc. All rights reserved."
      sysobjectid: 1.3.6.1.4.1.9.12.3.1.3.1084
    # The case that fixes this profile's priority at 60: a Nexus that reports
    # its object id from ciscoProducts (1.3.6.1.4.1.9.1.), which `cisco_ios`
    # claims as a prefix. sysDescr must win over another profile's prefix, and
    # it only does when the two profiles' priorities are equal.
    - sysdescr: "Cisco NX-OS(tm) n9000, Software (n9000-dk9), Version 9.3(10), RELEASE SOFTWARE Copyright (c) 2002-2023 by Cisco Systems, Inc."
      sysobjectid: 1.3.6.1.4.1.9.1.2348
    # The object id on its own, when sysDescr was not read.
    - sysdescr: ""
      sysobjectid: .1.3.6.1.4.1.9.12.3.1.3.1508
  reject:
    - sysdescr: "Cisco IOS Software, C3750E Software (C3750E-UNIVERSALK9-M), Version 15.2(4)E10, RELEASE SOFTWARE (fc2)"
      sysobjectid: 1.3.6.1.4.1.9.1.516
    - sysdescr: "Cisco IOS Software [Gibraltar], Catalyst L3 Switch Software (CAT9K_IOSXE), Version 16.12.4, RELEASE SOFTWARE (fc5)"
      sysobjectid: .1.3.6.1.4.1.9.1.2494
    - sysdescr: "Arista Networks EOS version 4.26.1F running on an Arista Networks DCS-7050QX-32S"
      sysobjectid: 1.3.6.1.4.1.30065.1.3011.7050
    - sysdescr: "Linux core-fw 5.15.0-91-generic #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023 x86_64"
      sysobjectid: 1.3.6.1.4.1.8072.3.2.10
probe:
  match:
    # The opening lines of the recorded `show version` of a Nexus 93180YC-FX3,
    # verbatim (captures/n9k-version/show_version.txt).
    - "show version": |
        Cisco Nexus Operating System (NX-OS) Software
        TAC support: http://www.cisco.com/tac
        Copyright (C) 2002-2025, Cisco and/or its affiliates.
        All rights reserved.
    # The other wording, which the older releases and the SNMP agent use.
    # (From Cisco's documentation, not from a capture.)
    - "show version": |
        Cisco NX-OS(tm) n5000, Software (n5000-uk9), Version 7.3(8)N1(1), RELEASE SOFTWARE Copyright (c) 2002-2019 by Cisco Systems, Inc.
  reject:
    # The other Cisco operating systems answer `show version` too.
    - "show version": |
        Cisco IOS Software, C2960 Software (C2960-LANBASEK9-M), Version 12.2(55)SE9, RELEASE SOFTWARE (fc1)
        Copyright (c) 1986-2014 by Cisco Systems, Inc.
    - "show version": |
        Cisco IOS XE Software, Version 16.12.04
        Cisco IOS Software [Gibraltar], Catalyst L3 Switch Software (CAT9K_IOSXE), Version 16.12.4, RELEASE SOFTWARE (fc5)
    - "show version": |
        Cisco IOS XR Software, Version 7.3.2
        Copyright (c) 2013-2021 by Cisco Systems, Inc.
    - "show version": |
        Arista cEOSLab
        Hardware version:
    - "show version": "-bash: show: command not found\n"
