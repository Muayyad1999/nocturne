# What NX-OS prints when it refuses a command, and what it prints when it
# does not. NX-OS has two voices: the command parser complains with `%` like
# IOS, and the features complain with `ERROR:` and no percent sign at all.
exec:
  rejected:
    - output: |
        show nonsense
                  ^
        % Invalid command at '^' marker.
      error: "% Invalid command at '^' marker."
    - output: "% Incomplete command at '^' marker.\n"
      error: "% Incomplete command at '^' marker."
    - output: "% Ambiguous command at '^' marker.\n"
      error: "% Ambiguous command at '^' marker."
    - "% Invalid range at '^' marker.\n"
    # Refused by role-based access control.
    - "% Permission denied for the role\n"
    # The feature's own voice, which the base's `%` patterns never see.
    - output: "ERROR: Invalid number of arguments\n"
      error: "ERROR: Invalid number of arguments"
    - output: |
        ERROR: VLAN 4095 is not available in current VDC
      error: "ERROR: VLAN 4095 is not available in current VDC"
  clean:
    # Real output of `show interface` on a Nexus 93180YC: an SVI whose VLAN is
    # down. It says "is down" several times and refuses nothing.
    - |
      Vlan20 is down (VLAN/BD is down), line protocol is down
        Hardware is EtherSVI, address is  5087.89a1.d8d5
        Internet Address is 10.1.20.3/24
        MTU 1500 bytes, BW 1000000 Kbit, DLY 10 usec,
         reliability 255/255, txload 1/255, rxload 1/255
    # Log messages: NX-OS puts the timestamp, the host and the virtual device
    # context in front of the facility tag, so they never start with `%`.
    - |
      2025 Mar  4 14:22:07 switch %$ VDC-1 %$ %ETHPORT-5-IF_DOWN_LINK_FAILURE: Interface Ethernet1/1 is down (Link failure)
      2025 Mar  4 14:22:09 switch %$ VDC-1 %$ %ETH_PORT_CHANNEL-5-PORT_DOWN: port-channel10: Ethernet1/1 is down
    # Real output of `show ip arp`: an address NX-OS is still resolving.
    - |
      IP ARP Table for all contexts
      Total number of entries: 22
      Address         Age       MAC Address     Interface
      10.5.6.10       00:00:16  INCOMPLETE      Vlan1425
    - |
      [########################################] 100%
      Copy complete.
config:
  rejected:
    - output: |
        switch(config-if)#channel-group 10 mode active
        ERROR: Ethernet1/1: Config not allowed, as first port of the port-channel is a layer-2 port
      error: "ERROR: Ethernet1/1: Config not allowed, as first port of the port-channel is a layer-2 port"
    - output: |
        switch(config)#vlan 5000
                            ^
        % Invalid command at '^' marker.
      error: "% Invalid command at '^' marker."
    - "ERROR: Cannot remove VLAN 1\n"
  clean:
    - "2025 Mar  4 14:25:00 switch %$ VDC-1 %$ %VLAN_MGR-2-CRITICAL_MSG: VLAN manager received a configuration change\n"
    - |
      [########################################] 100%
      Copy complete.
