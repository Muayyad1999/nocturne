description: >-
  An SSH session on a Nexus. The point of the transcript is what the driver
  must **not** send: NX-OS has one privilege level, so `enable` is never
  offered — the profile sets `cli.enable: null` — and the session is at the
  `#` prompt from the first byte. Then a command the feature refuses with
  `ERROR:` and no percent sign, a configuration change, a save with
  `copy running-config startup-config` (NX-OS has no `write memory`), and the
  running configuration, whose three header lines and the log message a
  console printed into the middle of it must be gone from what the driver
  returns. Scripted from how NX-OS behaves; no device was recorded.
credentials: {username: admin, password: secret}
greeting: "\r\nCisco Nexus Operating System (NX-OS) Software\r\nTAC support: http://www.cisco.com/tac\r\n\r\nn9k-leaf1#"
dialogue:
  # Straight to the init commands: no `enable`, no enable password.
  - recv: terminal length 0
    send: "terminal length 0\r\nn9k-leaf1#"
  - recv: terminal width 511
    send: "terminal width 511\r\nn9k-leaf1#"
  - recv: show hostname
    send: "show hostname\r\nn9k-leaf1\r\nn9k-leaf1#"
  - recv: show vlan id 5000
    send: "show vlan id 5000\r\nERROR: VLAN 5000 is not available in current VDC\r\nn9k-leaf1#"
  - recv: configure terminal
    send: "configure terminal\r\nEnter configuration commands, one per line. End with CNTL/Z.\r\nn9k-leaf1(config)#"
  - recv: interface Ethernet1/2
    send: "interface Ethernet1/2\r\nn9k-leaf1(config-if)#"
  - recv: description spare
    send: "description spare\r\nn9k-leaf1(config-if)#"
  - recv: end
    send: "end\r\nn9k-leaf1#"
  - recv: copy running-config startup-config
    send: "copy running-config startup-config\r\n[########################################] 100%\r\nCopy complete.\r\nn9k-leaf1#"
  - recv: show running-config
    send: |-
      show running-config
      !Command: show running-config
      !Running configuration last done at: Tue Mar  4 14:30:58 2025
      !Time: Tue Mar  4 14:31:02 2025

      version 10.4(5) Bios:version 01.11
      hostname n9k-leaf1
      interface Ethernet1/2
        description spare
      2025 Mar  4 14:31:02 n9k-leaf1 %$ VDC-1 %$ %VSHD-5-VSHD_SYSLOG_CONFIG_I: Configured from vty by admin on 10.0.0.5@pts/0
      interface mgmt0
        vrf member management
        ip address 10.0.99.11/24

      n9k-leaf1#
actions:
  - start:
      hostname: n9k-leaf1
      prompt: "n9k-leaf1#"
      login_screen: Cisco Nexus Operating System
    # One privilege level: at the prompt is as privileged as it gets.
    mode: privileged
  - exec: show hostname
    output: n9k-leaf1
  - exec: show vlan id 5000
    error: "ERROR: VLAN 5000 is not available in current VDC"
  - configure: [interface Ethernet1/2, description spare]
    mode: privileged
  - save: true
  - fetch_config: running
    # The two timestamps, the `!Command:` line and the console's log message
    # are gone; everything else is kept exactly as NX-OS printed it, two-space
    # indentation included.
    config: |
      version 10.4(5) Bios:version 01.11
      hostname n9k-leaf1
      interface Ethernet1/2
        description spare
      interface mgmt0
        vrf member management
        ip address 10.0.99.11/24
