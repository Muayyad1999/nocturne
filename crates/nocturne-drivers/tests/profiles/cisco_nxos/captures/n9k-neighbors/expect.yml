kinds:
  neighbors:
    # Five from CDP, four from LLDP.
    count: 9
    rows:
      # CDP: "Device ID:PERIMETER" and no System Name line, so the device id
      # is the name.
      - device: PERIMETER
        protocol: cdp
        local_interface: mgmt0
        remote_interface: FastEthernet1/0/32
        platform: cisco WS-C3750-48TS
        address: 10.1.100.1
        capabilities: Router Switch IGMP Filtering
      # "Device ID:dc-lf03(SAL19069XXX)" / "System Name: dc-lf03"
      - local_interface: Ethernet1/1
        device: dc-lf03
        protocol: cdp
        remote_interface: Ethernet1/1
        platform: N9K-C9372TX
        address: 10.1.100.226
        capabilities: Router Switch IGMP Filtering Supports-STP-Dispute
      # The management address differs from the interface address here.
      - local_interface: Ethernet1/49
        device: dc-sp01
        protocol: cdp
        remote_interface: Ethernet1/52
        address: 10.1.100.222
      - local_interface: Ethernet1/50
        device: dc-sp02
        protocol: cdp
        remote_interface: Ethernet1/52
        address: 10.1.100.223
      # LLDP: "Local Port id: mgmt0", "Port id: Fa1/0/9", a whole IOS version
      # line as the system description.
      - device: Switch.cisco.com
        protocol: lldp
        local_interface: mgmt0
        remote_interface: Fa1/0/9
        platform: "Cisco IOS Software, C3750 Software (C3750-IPBASEK9-M), Version 12.2(44)SE2, RELEASE SOFTWARE (fc2)"
        address: 10.30.140.1
        capabilities: B, R
      # "Local Port id: Eth1/1" is expanded; "Port id: Ethernet1/1" is the
      # neighbour's own name and is left as advertised.
      - local_interface: Ethernet1/1
        device: n9k2.company.com
        protocol: lldp
        remote_interface: Ethernet1/1
        address: 10.30.140.21
      - local_interface: Ethernet2/2
        device: N3K.cisconxapi.com
        protocol: lldp
        remote_interface: Ethernet1/49
        platform: "Cisco Nexus Operating System (NX-OS) Software 6.0(2)U4(1)"
        address: 10.30.140.30
