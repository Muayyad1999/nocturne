# Nothing may select the generic profile: it is the answer only when nothing else fits.
banner:
  reject:
    - "SSH-2.0-OpenSSH_9.6"
    - "SSH-2.0-dropbear_2022.83"
    - "Welcome to an appliance nobody has heard of"
snmp:
  reject:
    - sysdescr: "An appliance nobody has heard of"
      sysobjectid: 1.3.6.1.4.1.99999.1
probe:
  reject:
    - "show version": "An appliance nobody has heard of, version 1.0\n"
