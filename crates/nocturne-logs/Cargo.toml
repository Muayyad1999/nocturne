[package]
name = "nocturne-logs"
description = "Syslog and trap reception, flow collection, log search, live tail, pattern rules and device log buffers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nocturne-app.workspace = true
nocturne-drivers.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
nocturne-netprobe.workspace = true
nocturne-snmp.workspace = true
regex.workspace = true
chrono.workspace = true
bytes.workspace = true
rusqlite.workspace = true
# Device output reaches the log store (a pulled `show logging` buffer, a line
# a device wrote about its own configuration), so everything kept goes
# through the same redactor the assistant's context does.
nocturne-ai.workspace = true
# What a port and a DSCP value are called in `flows.top`: the reference
# tables the toolbox shows, so that one port has one name everywhere.
nocturne-tools.workspace = true
# Forwarding to a log platform: JSON over HTTPS on reqwest (syslog over TLS is
# the engine's own sender). rustls is named only to install the ring provider
# reqwest is built without.
reqwest.workspace = true
rustls.workspace = true

[dev-dependencies]
nocturne-app = { workspace = true, features = ["testing"] }
# The collectors the forwarder tests send to: a TLS syslog listener and an
# HTTPS endpoint, each with a certificate made in the test. The same rcgen
# `nocturne-netprobe` and `nocturne-monitor` use for theirs.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# A trap datagram as large as UDP allows needs a send buffer to fit it in.
socket2.workspace = true
# The flood test needs more log lines than anyone would write by hand: the
# simulator emits the real ones its devices produce.
nocturne-netsim.workspace = true

[lints]
workspace = true
