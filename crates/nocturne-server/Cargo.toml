[package]
name = "nocturne-server"
description = "Headless server mode: HTTP + WebSocket adapter over the app RPC with the embedded web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nocturne-suite.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
tower-http = { workspace = true, features = ["catch-panic"] }
# `debug-embed`: the UI is compiled in for every profile, so debug and release
# builds behave the same and nothing is ever read from `ui/dist` at run time.
rust-embed = { workspace = true, features = ["debug-embed"] }
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rand.workspace = true
hex.workspace = true
sha2.workspace = true
dirs.workspace = true
# TLS is rustls + ring only (no aws-lc-rs, no OpenSSL).
rustls.workspace = true
tokio-rustls.workspace = true
# The `call` / `methods` scripting client.
reqwest.workspace = true

# Not declared by the workspace. All pure Rust; all but `gethostname` and `open`
# were already in the lock file as dependencies of axum, rustls or reqwest.
hyper = { version = "1.12", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
tower = { version = "0.5.3", features = ["util"] }
mime_guess = "2.0.5"
percent-encoding = "2.3"
subtle = "2.6"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
time = { version = "0.3.55", default-features = false, features = ["std"] }
gethostname = "1.1"
open = "5.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29"
tempfile.workspace = true
base64.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# Sends SIGTERM to the spawned binary in the end-to-end test.
rustix = { version = "1.1", features = ["process"] }

[lints]
workspace = true
