[package]
name = "nocturne-monitor"
description = "Polling, time series, alert rules, alerts, maintenance windows and notifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nocturne-app.workspace = true
nocturne-drivers.workspace = true
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
nocturne-netprobe.workspace = true
nocturne-snmp.workspace = true
chrono.workspace = true
rusqlite.workspace = true
# Notification channels: HTTP(S) webhooks over reqwest, and SMTP with STARTTLS
# written directly on tokio-rustls — rustls + ring, no C dependency.
reqwest.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-platform-verifier.workspace = true
base64.workspace = true

[dev-dependencies]
nocturne-app = { workspace = true, features = ["testing"] }
# Generates the certificates of the TLS service-check tests: one that expires
# next week, one that expired last year. The same version `nocturne-netprobe`
# uses for its own loopback TLS tests.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# The QoS tests read a router that really shapes and drops: the simulator's
# reference campus, whose `show policy-map interface` output goes through the
# real `cisco_ios` profile. The simulator is an engine, not a feature, so
# depending on it here breaks no layering rule.
nocturne-netsim.workspace = true

[lints]
workspace = true
