[package]
name = "nocturne-automation"
description = "Command runner, configuration templates, playbooks, schedules and Ansible interoperability."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nocturne-app.workspace = true
nocturne-drivers.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
nocturne-textfsm.workspace = true
# `fuel` is what bounds the work and the memory of one rendering (`render.rs`):
# a template is given to a person to write, and a loop or a value can be made
# to cost gigabytes.
minijinja = { workspace = true, features = ["fuel"] }
regex.workspace = true
serde_yaml_ng.workspace = true
indexmap.workspace = true
chrono.workspace = true
csv.workspace = true
# The Ansible interop writes a temporary inventory (0600) and removes it again.
tempfile.workspace = true

[dev-dependencies]
nocturne-app = { workspace = true, features = ["testing"] }
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# The QoS templates are typed into a simulated router to see that it takes
# every line. The simulator is an engine, not a feature, so depending on it
# here breaks no layering rule.
nocturne-netsim.workspace = true

[lints]
workspace = true
