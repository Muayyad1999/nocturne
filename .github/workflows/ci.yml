name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust — format, lint, test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The toolchain and its components are pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Real peers for the interoperability tests (they skip cleanly when absent).
      - name: Install net-snmp, OpenSSH server and telnetd for interop tests
        # A package mirror having a bad afternoon must not fail a build. The
        # interoperability tests skip with a stated reason when their peers
        # are missing — that is the whole point of writing them that way — so
        # the worst case here is a run that checks slightly less, not a red
        # tick that means nothing. Three tries first, because most of these
        # failures are transient.
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                 snmpd snmp openssh-server sshpass inetutils-telnetd telnet; then
              exit 0
            fi
            echo "apt failed on attempt $attempt; retrying in 15s"
            sleep 15
          done
          echo "could not install the interop peers: those tests will skip and say so"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  rust-portability:
    name: Rust — build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  ui:
    name: UI — typecheck, unit tests, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows as well as Linux, because a case-insensitive filesystem
        # resolves an import differently and that made the whole interface
        # unbuildable there while this job was green: `import './Compare'`
        # found `compare.ts` instead of `Compare.tsx`. Nothing else in CI
        # built the interface anywhere but Linux, so the first time anyone
        # found out was the first time a release was attempted.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: No two files differ only in case
        shell: bash
        run: ./scripts/check-case-collisions.sh
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build
      # Only the Linux build's output is kept: it is what the end-to-end job
      # consumes, and two jobs uploading one name is an error.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 3

  e2e:
    name: End to end — the UI against the real backend
    needs: [ui]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - name: Install the browser the end-to-end tests drive
        # `--with-deps` is apt underneath, so it fails the same way.
        run: |
          for attempt in 1 2 3; do
            if pnpm --dir ui exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install failed on attempt $attempt; retrying in 15s"
            sleep 15
          done
          echo "the browser could not be installed"
          exit 1
      - run: pnpm --dir ui build
      - run: cargo build -p nocturne-server
      - run: pnpm --dir ui e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/test-results
          retention-days: 7

  # The desktop shell is outside the workspace's `default-members`, so `cargo
  # test` never compiles it: without this, it could stop building the moment a
  # feature crate changes and nobody would find out until a release.
  desktop:
    name: Desktop shell — it still compiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux WebView dependencies Tauri needs
        # Unlike the interop peers these are needed to build at all, so a
        # failure here is a real failure — but it is usually a transient one.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            echo "apt failed on attempt $attempt; retrying in 15s"
            sleep 15
          done
          echo "the WebView dependencies could not be installed"
          exit 1
      # Its `build.rs` embeds a built interface when there is one and a page
      # saying there is not when there is not, so this needs no `pnpm build`.
      - run: cargo clippy -p nocturne-desktop --all-targets -- -D warnings
      - run: cargo test -p nocturne-desktop
