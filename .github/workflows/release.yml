name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build (for a dry run, any existing tag)
        required: true

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: ""
          - os: windows-latest
            target: ""
          - os: macos-latest
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - run: rustup toolchain install
      - name: Add the macOS universal target
        if: matrix.target != ''
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux WebView and bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Nocturne ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          releaseBody: |
            See `docs/STATUS.md` for what is built and how it has been checked.

            These installers are not signed yet, so Windows SmartScreen and
            macOS Gatekeeper will warn about them.

  server:
    name: Server binary (${{ matrix.edition }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        # The ISP edition ships as the server; the free edition ships as the
        # desktop application and as a server for anyone who wants one. Two
        # artefacts rather than one binary with a switch in it, which is the
        # whole of the commercial control — see `docs/dev/spec-editions.md`.
        edition: [free, isp]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The server embeds the interface, so it is built first.
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - name: Build the server
        shell: bash
        run: |
          if [ "${{ matrix.edition }}" = "isp" ]; then
            cargo build --release -p nocturne-server --features isp
          else
            cargo build --release -p nocturne-server
          fi
      - name: Name the binary after its platform
        shell: bash
        run: |
          mkdir -p artifacts
          name="nocturne-server-${{ matrix.edition }}-${{ runner.os }}-${{ runner.arch }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/nocturne-server.exe "artifacts/$name.exe"
          else
            cp target/release/nocturne-server "artifacts/$name"
          fi
      # Nothing else in either workflow ever *runs* a release build, so without
      # this a tag could ship a server that does not start, or one carrying
      # the "build the interface first" fallback page instead of the
      # interface. Both are silent: the compile succeeds either way.
      - name: It starts, it answers, and it is carrying the real interface
        shell: bash
        run: |
          set -euo pipefail
          bin=$(ls artifacts/nocturne-server-*)
          dir=$(mktemp -d)
          "$bin" --data-dir "$dir" --port 8799 > server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if "$bin" call --data-dir "$dir" app.methods > methods.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat server.log
          # `ui="embedded"` and `ui="not built (fallback page)"` are the two
          # things this is here to tell apart.
          grep -q 'ui="embedded"' server.log
          # One method from the core and one from four different feature
          # crates: proof the whole suite assembled, not just that a binary
          # with a working `--help` came out.
          for method in app.info terminal.open changes.apply monitor.status ipam.prefixes tools.list; do
            grep -q "\"$method\"" methods.json || { echo "missing: $method"; exit 1; }
          done
          # And the edition is what the artefact says it is. This is the last
          # point at which a mistake is still cheap: a free installer that
          # answers `isp.customers` has shipped somebody else's subscriber
          # ledger to everyone, and an ISP build that does not answer it is a
          # paid artefact missing the thing it was paid for.
          if [ "${{ matrix.edition }}" = "isp" ]; then
            grep -q '"isp.customers"' methods.json || { echo "the ISP edition has no billing methods"; exit 1; }
            grep -q '"isp.summary"' methods.json
          elif grep -q '"isp\.' methods.json; then
            echo "the free edition is carrying billing methods:"
            grep -o '"isp\.[a-z.]*"' methods.json
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-server-${{ matrix.edition }}-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/*
          retention-days: 14
