name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build (for a dry run, any existing tag)
        required: true

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: ""
          - os: windows-latest
            target: ""
          - os: macos-latest
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - run: rustup toolchain install
      - name: Add the macOS universal target
        if: matrix.target != ''
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux WebView and bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Nocturne ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          releaseBody: |
            See `docs/STATUS.md` for what is built and how it has been checked.

            These installers are not signed yet, so Windows SmartScreen and
            macOS Gatekeeper will warn about them.

  server:
    name: Server binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The server embeds the interface, so it is built first.
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - run: cargo build --release -p nocturne-server
      - name: Name the binary after its platform
        shell: bash
        run: |
          mkdir -p artifacts
          name="nocturne-server-${{ runner.os }}-${{ runner.arch }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/nocturne-server.exe "artifacts/$name.exe"
          else
            cp target/release/nocturne-server "artifacts/$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-server-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/*
          retention-days: 14
