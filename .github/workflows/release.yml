name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          The tag to build. It has to name the version the code at that tag
          carries (`v` + `[workspace.package] version` in Cargo.toml), as a
          pushed tag does.
        required: true

permissions:
  contents: write

jobs:
  # Three desktop jobs run at once and each used to create the release for
  # the tag. One wins and the others are meant to find what it made — but
  # they raced, and the Ubuntu one was refused with "Resource not accessible
  # by integration" on create-a-release, so a tag shipped without its Linux
  # packages. Making the release once, here, removes the race: the builders
  # only ever upload to it.
  release:
    name: The release the installers are uploaded to
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.make.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # Every installer's file name, the version inside each package,
      # `--version` and `app.info` come from this one number. Two tags that
      # built the same number shipped files that could not be told apart, and
      # a report saying "0.1.0" could not be tied to either.
      - id: version
        name: The tag names the version the code carries
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          carried=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p;}' Cargo.toml | head -n 1)
          if [ -z "$carried" ]; then
            echo "::error::Cargo.toml has no [workspace.package] version"
            exit 1
          fi
          if [ "$TAG" != "v$carried" ]; then
            echo "::error::The tag is $TAG, but the code at it is version $carried. Set the version in Cargo.toml ([workspace.package]), commit, and tag v<version>."
            exit 1
          fi
          # The desktop bundle takes its version from Cargo.toml only while
          # tauri.conf.json does not name one of its own.
          if jq -e 'has("version")' apps/desktop/src-tauri/tauri.conf.json > /dev/null; then
            echo "::error::apps/desktop/src-tauri/tauri.conf.json names a version of its own; it must come from Cargo.toml"
            exit 1
          fi
          echo "version=$carried" >> "$GITHUB_OUTPUT"
          case "$carried" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A re-run must not make a second release for the same tag. The
          # release made here is a draft, and `releases/tags/<tag>` only
          # answers for a published one, so the draft a first run made was
          # invisible to the second and a duplicate appeared. The list
          # includes drafts for a token that may write.
          #
          # `gh api` prints an error body on stdout, so "not empty" is not
          # the same as "found" — only an id made of digits counts as one.
          existing=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null | head -n 1 || true)
          case "$existing" in
            '' | *[!0-9]*) existing='' ;;
          esac
          if [ -n "$existing" ]; then
            echo "the release for $TAG already exists ($existing)"
            echo "id=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body=$'Which file to take, and how to get past the warnings on first start: `docs/TRYING-IT.md`. What is built and how it has been checked: `docs/STATUS.md`.\n\nNone of these files is signed by a certificate authority. Windows SmartScreen warns about the installers; macOS opens the app only once it has been allowed in System Settings → Privacy & Security.'
          # A draft, published by hand once its files are all there. A tag
          # with a pre-release part (`v0.2.0-alpha.1`) is marked as one, so
          # that publishing it does not make it the repository's latest.
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" \
            -f name="Nocturne $TAG" \
            -f body="$body" \
            -F draft=true \
            -F prerelease="$PRERELEASE" \
            --jq .id)
          echo "made the release for $TAG ($id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop installers (${{ matrix.edition }}, ${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      # Both editions, on every platform. The ISP build is the same
      # application with `nocturne-isp` compiled in, and it is a *separate
      # product*: its own name and its own identifier, so the two install
      # side by side and neither upgrades over the other. That also keeps
      # their installer filenames apart, which is what lets both live in one
      # release.
      matrix:
        include:
          - os: ubuntu-24.04
            target: ""
            edition: free
          - os: ubuntu-24.04
            target: ""
            edition: isp
          - os: windows-latest
            target: ""
            edition: free
          - os: windows-latest
            target: ""
            edition: isp
          - os: macos-latest
            target: universal-apple-darwin
            edition: free
          - os: macos-latest
            target: universal-apple-darwin
            edition: isp
    runs-on: ${{ matrix.os }}
    env:
      EDITION: ${{ matrix.edition }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - run: rustup toolchain install
      - name: Add the macOS universal target
        if: matrix.target != ''
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # The Ayatana indicator library, not the old libappindicator: the CLI
      # makes the packages depend on whichever of the two it finds here, and
      # Debian 12 and 13 ship only the Ayatana one. `rpm` is for the check
      # below, which reads the RPM back.
      - name: Install the Linux WebView, tray and bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            rpm rpm2cpio cpio
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      # Windows Installer takes a version of numbers only, at most four of
      # them, so `0.2.0-alpha.3` is given to the MSI as `0.2.0.3`. Every
      # other package keeps the version as it is.
      - name: The MSI's version
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          core=${VERSION%%[-+]*}
          pre=${VERSION#"$core"}
          pre=${pre#-}
          pre=${pre%%+*}
          if [ -n "$pre" ]; then
            number=$(printf '%s' "$pre" | grep -oE '[0-9]+$' || true)
            if [ -z "$number" ] || [ "$number" -gt 65535 ]; then
              echo "::error::The MSI needs a number at the end of the pre-release part of $VERSION (such as 0.2.0-alpha.3)"
              exit 1
            fi
            printf '{"bundle":{"windows":{"wix":{"version":"%s.%s"}}}}\n' "$core" "$number" \
              > apps/desktop/src-tauri/tauri.msi.conf.json
            echo "MSI_CONFIG=--config tauri.msi.conf.json" >> "$GITHUB_ENV"
          fi
      # Builds only. Nothing goes to the release until the check after this
      # has read every file back.
      - id: build
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_LINUX_AYATANA_APPINDICATOR: "true"
        with:
          projectPath: apps/desktop/src-tauri
          # `--config` is merged over `tauri.conf.json`; the path is relative
          # to `projectPath` above, which is where both files live.
          args: >-
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
            ${{ matrix.edition == 'isp' && '--features isp --config tauri.isp.conf.json' || '' }}
            ${{ env.MSI_CONFIG }}
      # Each installer is unpacked and its program asked what it is: the
      # edition comes from the engine it was built with, so a misapplied
      # `--features` or `--config` fails here instead of shipping.
      - name: Every installer is named for its edition and carries it
        shell: bash
        env:
          ARTIFACTS: ${{ steps.build.outputs.artifactPaths }}
          UPLOAD_DIR: checked-installers
        run: bash apps/desktop/scripts/check-installers.sh
      - name: Upload them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          UPLOAD_DIR: checked-installers
        run: |
          set -euo pipefail
          if [ -z "$(ls -A "$UPLOAD_DIR" 2> /dev/null)" ]; then
            echo "::error::nothing to upload"
            exit 1
          fi
          gh release upload "$TAG" "$UPLOAD_DIR"/* --clobber

  server:
    name: Server binary (${{ matrix.edition }}, ${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        # The ISP edition ships as the server; the free edition ships as the
        # desktop application and as a server for anyone who wants one. Two
        # artefacts rather than one binary with a switch in it, which is the
        # whole of the commercial control — see `docs/dev/spec-editions.md`.
        edition: [free, isp]
    runs-on: ${{ matrix.os }}
    env:
      EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - run: rustup toolchain install
      # macos-latest is an Apple silicon runner. One binary holding both
      # architectures, as the desktop app does, so an Intel Mac is not left
      # without a server.
      - name: Add both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The server embeds the interface, so it is built first.
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - name: Build the server
        shell: bash
        run: |
          set -euo pipefail
          features=""
          if [ "$EDITION" = "isp" ]; then features="--features isp"; fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release -p nocturne-server $features --target "$target"
            done
            mkdir -p target/release
            lipo -create -output target/release/nocturne-server \
              target/aarch64-apple-darwin/release/nocturne-server \
              target/x86_64-apple-darwin/release/nocturne-server
          else
            cargo build --release -p nocturne-server $features
          fi
      # Named for what it is and where it runs, in a folder of the same name,
      # so that both editions can be unpacked side by side.
      - name: Put the binary in a folder named for it
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux) platform=linux-x64 ;;
            Windows) platform=windows-x64 ;;
            macOS) platform=macos-universal ;;
          esac
          name="nocturne-server-$EDITION-$platform"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/nocturne-server.exe "dist/$name/"
          else
            cp target/release/nocturne-server "dist/$name/"
          fi
          echo "SERVER_NAME=$name" >> "$GITHUB_ENV"
      - name: Rosetta, to start the Intel half of the macOS binary
        if: runner.os == 'macOS'
        run: |
          if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      # Nothing else in either workflow ever *runs* a release build, so without
      # this a tag could ship a server that does not start, or one carrying
      # the "build the interface first" fallback page instead of the
      # interface. Both are silent: the compile succeeds either way. On macOS
      # each architecture in the binary is started in turn.
      - name: It starts, it answers, and it is carrying the real interface
        shell: bash
        run: |
          set -euo pipefail
          bin=$(ls "dist/$SERVER_NAME"/nocturne-server*)
          slices=native
          if [ "${{ runner.os }}" = "macOS" ]; then
            slices=$(lipo -archs "$bin")
            case " $slices " in
              *" x86_64 "*" arm64 "* | *" arm64 "*" x86_64 "*) ;;
              *) echo "::error::the macOS server holds $slices, not both architectures"; exit 1 ;;
            esac
          fi
          for slice in $slices; do
            run=""
            if [ "$slice" != native ]; then run="arch -$slice"; fi
            echo "== $slice"
            dir=$(mktemp -d)
            $run "$bin" --data-dir "$dir" --port 0 > server.log 2>&1 &
            server=$!
            answered=false
            for _ in $(seq 1 60); do
              if $run "$bin" call --data-dir "$dir" app.methods > methods.json 2> /dev/null; then
                answered=true
                break
              fi
              sleep 1
            done
            kill "$server" 2> /dev/null || true
            wait "$server" 2> /dev/null || true
            cat server.log
            if [ "$answered" != true ]; then
              echo "::error::the server did not answer ($slice)"
              exit 1
            fi
            # `ui="embedded"` and `ui="not built (fallback page)"` are the two
            # things this is here to tell apart.
            grep -q 'ui="embedded"' server.log
            # One method from the core and one from four different feature
            # crates: proof the whole suite assembled, not just that a binary
            # with a working `--help` came out.
            for method in app.info terminal.open changes.apply monitor.status ipam.prefixes tools.list; do
              grep -q "\"$method\"" methods.json || { echo "missing: $method"; exit 1; }
            done
            # And the edition is what the artefact says it is. This is the last
            # point at which a mistake is still cheap: a free server that
            # answers `isp.customers` has shipped somebody else's subscriber
            # ledger to everyone, and an ISP build that does not answer it is a
            # paid artefact missing the thing it was paid for.
            if [ "$EDITION" = "isp" ]; then
              grep -q '"isp.customers"' methods.json || { echo "the ISP edition has no billing methods"; exit 1; }
              grep -q '"isp.summary"' methods.json
            elif grep -q '"isp\.' methods.json; then
              echo "the free edition is carrying billing methods:"
              grep -o '"isp\.[a-z.]*"' methods.json
              exit 1
            fi
          done
      # A tarball keeps the execute bit that a bare file or a workflow
      # artefact loses; Windows needs no such bit and gets a zip.
      - name: Pack it
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$SERVER_NAME' -DestinationPath '$SERVER_NAME.zip'"
            echo "SERVER_FILE=dist/$SERVER_NAME.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$SERVER_NAME.tar.gz" "$SERVER_NAME"
            echo "SERVER_FILE=dist/$SERVER_NAME.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "$SERVER_FILE" --clobber
